<style>
/* Layout: native-feeling iPhone app. Large titles, grouped lists, bottom tab bar, sheets. */

.stack { display: flex; flex-direction: column; gap: 10px; }

/* photos */
.shot { background: var(--card); border-radius: 18px; padding: 12px; display: flex; flex-direction: column; gap: 12px; }

.ph { position: relative; aspect-ratio: 4 / 3; border-radius: 12px; overflow: hidden; background: var(--fill); max-width: 100%; }

.ph .ok { position: absolute; right: 6px; top: 6px; width: 22px; height: 22px; border-radius: 11px; background: #1E7B34; display: flex; align-items: center; justify-content: center; }
.ph .bad { position: absolute; left: 0; right: 0; bottom: 0; padding: 6px 8px; background: #A04800; color: #FFFFFF; font-size: 12px; font-weight: 600; }
.take { position: absolute; inset: 0; border: 1.5px dashed var(--chev); border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: var(--blue); font-size: 13px; font-weight: 600; background: var(--card); cursor: pointer; }

.tab .badge { position: absolute; top: -2px; left: calc(50% + 6px); min-width: 18px; height: 18px; border-radius: 9px; background: var(--redbtn); color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 5px; }

.demo { font-size: 12px; color: var(--muted); text-align: center; padding: 18px 16px 0; line-height: 17px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
/* sign in */
.login { min-height: calc(100svh - 16px); display: flex; flex-direction: column; justify-content: center; gap: 22px; padding: 24px 0 32px; max-width: 420px; margin: 0 auto; }

.logo { display: block; flex-shrink: 0; }

.bad-field { outline: 2px solid var(--redbtn) !important; }

/* ---------- signature ---------- */
function setupSig() {
  const cv = document.getElementById('sig'); if (!cv) return;
  const j = job(S.view.id), r = j.report;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const rect = cv.getBoundingClientRect();
  cv.width = rect.width * dpr; cv.height = rect.height * dpr;
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
  const ink = '#1C1C1E';
  cv.style.background = '#FFFFFF';
  const guide = () => { ctx.save(); ctx.setLineDash([4, 4]); ctx.strokeStyle = 'rgba(128,128,128,0.45)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(16, rect.height - 34); ctx.lineTo(rect.width - 16, rect.height - 34); ctx.stroke(); ctx.restore(); };
  const blank = () => { ctx.clearRect(0, 0, rect.width, rect.height); guide(); };
  blank();
  let empty = !r.signed;
  if (r.signed) phGet('sig-' + j.id).then((v) => { if (!v) return; const im = new Image(); im.onload = () => ctx.drawImage(im, 0, 0, rect.width, rect.height); im.src = v; });
  else { ctx.fillStyle = 'rgba(128,128,128,0.75)'; ctx.font = '15px -apple-system, sans-serif'; ctx.textAlign = 'center'; ctx.fillText('Sign here with a finger', rect.width / 2, rect.height / 2 - 6); }
  ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = ink;
  let drawing = false, drew = false;
  const pt = (e) => { const b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  cv.addEventListener('pointerdown', (e) => {
    e.preventDefault(); cv.setPointerCapture(e.pointerId);
    if (empty) { blank(); empty = false; }
    drawing = true; const [x, y] = pt(e); ctx.beginPath(); ctx.moveTo(x, y);
  });
  cv.addEventListener('pointermove', (e) => { if (!drawing) return; e.preventDefault(); const [x, y] = pt(e); ctx.lineTo(x, y); ctx.stroke(); drew = true; });
  const end = () => {
    if (!drawing) return; drawing = false;
    if (drew) {
      phPut('sig-' + j.id, cv.toDataURL('image/png'));
      r.signed = true; save();
      const btn = document.querySelector('[data-a="submitReport"]');
      if (btn) { const ok = r.checks.every(Boolean); btn.disabled = !ok; btn.textContent = ok ? 'Finalize and submit' : 'Finish the checklist'; }
    }
  };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
}

/* ---------- photo processing ---------- */
function processPhoto(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => {
      const max = 1280, s = Math.min(1, max / Math.max(im.width, im.height));
      const w = Math.round(im.width * s), h = Math.round(im.height * s);
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(im, 0, 0, w, h);
      const sw = 200, sh = Math.max(1, Math.round(h * sw / w));
      const sc = document.createElement('canvas'); sc.width = sw; sc.height = sh;
      const sx = sc.getContext('2d'); sx.drawImage(im, 0, 0, sw, sh);
      const d = sx.getImageData(0, 0, sw, sh).data;
      const g = new Float32Array(sw * sh); let sum = 0;
      for (let i = 0; i < sw * sh; i++) { const v = 0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2]; g[i] = v; sum += v; }
      const mean = sum / (sw * sh);
      let lsum = 0, lsq = 0, n = 0;
      for (let y = 1; y < sh - 1; y++) for (let x = 1; x < sw - 1; x++) { const i = y * sw + x; const l = 4 * g[i] - g[i - 1] - g[i + 1] - g[i - sw] - g[i + sw]; lsum += l; lsq += l * l; n++; }
      const lvar = n ? lsq / n - (lsum / n) ** 2 : 0;
      URL.revokeObjectURL(url);
      let issue = '';
      if (mean < 45) issue = 'Too dark · retake';
      else if (lvar < 18) issue = 'Blurry · retake';
      resolve({ data: cv.toDataURL('image/jpeg', 0.72), ok: !issue, issue });
    };
    im.onerror = () => { URL.revokeObjectURL(url); reject(new Error('read')); };
    im.src = url;
  });
}

/* ---------- password field helpers ---------- */
function pwRules() {
  const a = document.getElementById('pw1'), b = document.getElementById('pw2'); if (!a || !b) return false;
  const len = a.value.length >= 8, match = len && a.value === b.value;
  const rl = document.getElementById('r-len'), rm = document.getElementById('r-match'), go = document.getElementById('pwgo');
  if (rl) rl.classList.toggle('ok', len); if (rm) rm.classList.toggle('ok', match); if (go) go.disabled = !(len && match);
