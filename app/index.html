.chev { width: 8px; height: 13px; flex-shrink: 0; }

/* ---------- installer ---------- */
function myJobs() { return S.jobs.filter((j) => j.installer === ME_INSTALLER || j.second === ME_INSTALLER); }

  if (S.tab === 'earnings') return installerEarnings();
  const mine = myJobs().sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));

    S.cant = S.cant || { mode: 'resched', slot: 1, reason: '' };
    const m = S.cant;
    body = `<div style="display:flex;justify-content:space-between;align-items:center"><button type="button" class="link" style="padding:6px 0" data-a="closeSheet">Cancel</button><b>${esc(j.store)}</b><span style="width:52px"></span></div>
      <div class="seg"><button type="button" class="${m.mode === 'resched' ? 'on' : ''}" data-a="cantMode" data-v="resched">Reschedule</button><button type="button" class="${m.mode === 'decline' ? 'on' : ''}" data-a="cantMode" data-v="decline">Decline</button></div>
      ${m.mode === 'resched' ? `<span class="cap" style="margin:6px 4px 0">Suggest a new time</span><div class="chips">${slots.map(([d, t], i) => `<button type="button" class="chip ${m.slot === i ? 'on' : ''}" data-a="cantSlot" data-v="${i}">${esc(whenLabel({ date: d, time: t }))}</button>`).join('')}</div>` : ''}
      <span class="cap" style="margin:6px 4px 0">Reason</span><textarea id="creason" class="box" data-cbind="1" placeholder="Short note for your admin" style="min-height:64px">${esc(m.reason)}</textarea>
      <button type="button" class="btn ${m.mode === 'decline' ? 'red' : ''}" data-a="cantSend" data-v="${j.id}">${m.mode === 'resched' ? 'Send request to admin' : 'Decline job'}</button>`;
    S._slots = slots;
  }
  overlay.innerHTML = `<div class="scrim"><button type="button" class="close" aria-label="Close" data-a="closeSheet"></button><div class="sheet" role="dialog" aria-modal="true"><span class="grab"></span>${body}</div></div>`;
}

/* ---------- signature ---------- */
function setupSig() {
  const cv = document.getElementById('sig'); if (!cv) return;
  const j = job(S.view.id), r = j.report;
  const dpr = window.devicePixelRatio || 1;
  const rect = cv.getBoundingClientRect();
  cv.width = rect.width * dpr; cv.height = rect.height * dpr;
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
  const ink = getComputedStyle(document.documentElement).getPropertyValue('--fg').trim() || '#1C1C1E';
  ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = ink;
  ctx.setLineDash([4, 4]); ctx.strokeStyle = 'rgba(128,128,128,0.4)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(16, rect.height - 34); ctx.lineTo(rect.width - 16, rect.height - 34); ctx.stroke();
  ctx.setLineDash([]); ctx.lineWidth = 2.6; ctx.strokeStyle = ink;
  if (r.signature) { const im = new Image(); im.onload = () => ctx.drawImage(im, 0, 0, rect.width, rect.height); im.src = r.signature; }
  else { ctx.fillStyle = 'rgba(128,128,128,0.7)'; ctx.font = '15px ' + getComputedStyle(document.body).fontFamily; ctx.textAlign = 'center'; ctx.fillText('Sign here with a finger', rect.width / 2, rect.height / 2 - 6); }
  let drawing = false, drew = false, cleared = !!r.signature;
  const pt = (e) => { const b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  cv.addEventListener('pointerdown', (e) => {
    e.preventDefault(); cv.setPointerCapture(e.pointerId);
    if (!cleared && !r.signature) { ctx.clearRect(0, 0, rect.width, rect.height); ctx.setLineDash([4, 4]); ctx.strokeStyle = 'rgba(128,128,128,0.4)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(16, rect.height - 34); ctx.lineTo(rect.width - 16, rect.height - 34); ctx.stroke(); ctx.setLineDash([]); ctx.lineWidth = 2.6; ctx.strokeStyle = ink; cleared = true; }
    drawing = true; const [x, y] = pt(e); ctx.beginPath(); ctx.moveTo(x, y);
  });
  cv.addEventListener('pointermove', (e) => { if (!drawing) return; e.preventDefault(); const [x, y] = pt(e); ctx.lineTo(x, y); ctx.stroke(); drew = true; });
  const end = () => {
    if (!drawing) return; drawing = false;
    if (drew) {
      // store as a transparent PNG with only the ink, so it reads in both themes
      const out = document.createElement('canvas'); out.width = cv.width; out.height = cv.height;
      const o = out.getContext('2d'); o.drawImage(cv, 0, 0);
      r.signature = out.toDataURL('image/png'); save();
      const btn = document.querySelector('[data-a="submitReport"]');
      if (btn) { const ok = r.checks.every(Boolean); btn.disabled = !ok; btn.textContent = ok ? 'Finalize and submit' : 'Finish the checklist'; }
    }
  };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end); cv.addEventListener('pointerleave', end);
}

/* ---------- photo processing ---------- */
function processPhoto(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => {
      const max = 720, s = Math.min(1, max / Math.max(im.width, im.height));
      const w = Math.round(im.width * s), h = Math.round(im.height * s);
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      const ctx = cv.getContext('2d'); ctx.drawImage(im, 0, 0, w, h);
      // quality check on a small grayscale copy
      const sw = 200, sh = Math.max(1, Math.round(h * sw / w));
      const sc = document.createElement('canvas'); sc.width = sw; sc.height = sh;
      const sx = sc.getContext('2d'); sx.drawImage(im, 0, 0, sw, sh);
      const d = sx.getImageData(0, 0, sw, sh).data;
      const g = new Float32Array(sw * sh); let sum = 0;
      for (let i = 0; i < sw * sh; i++) { const v = 0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2]; g[i] = v; sum += v; }
      const mean = sum / (sw * sh);
      let lsum = 0, lsq = 0, n = 0;
      for (let y = 1; y < sh - 1; y++) for (let x = 1; x < sw - 1; x++) { const i = y * sw + x; const l = 4 * g[i] - g[i - 1] - g[i + 1] - g[i - sw] - g[i + sw]; lsum += l; lsq += l * l; n++; }
      const lvar = n ? lsq / n - (lsum / n) ** 2 : 0;
      URL.revokeObjectURL(url);
      let issue = '';
      if (mean < 45) issue = 'Too dark · retake';
      else if (lvar < 18) issue = 'Blurry · retake';
      resolve({ data: cv.toDataURL('image/jpeg', 0.62), ok: !issue, issue, mean: Math.round(mean), sharp: Math.round(lvar) });
    };
    im.onerror = () => { URL.revokeObjectURL(url); reject(new Error('read')); };
    im.src = url;
  });
}

/* =================================================================== */
/* EVENTS                                                              */
/* =================================================================== */
const A = {
  pickUser(v) { S.login = { step: 'code', who: v }; render(false); },
  loginBack() { S.login = { step: 'pick', who: null }; render(false); },
  verify() { const who = S.login.who; if (USERS[who].admin) { S.login = { step: 'workspace', who }; } else { S.user = who; S.role = 'installer'; S.tab = 'jobs'; S.login = { step: 'pick', who: null }; } render(false); },
  enter(v) { S.user = S.login.who; S.role = v; S.tab = v === 'admin' ? 'overview' : 'jobs'; S.login = { step: 'pick', who: null }; render(false); },
  tab(v) { S.tab = v; S.view = null; render(false); },
  set(v, el) { S[el.dataset.k] = Number(v); render(); },
  sheet(v) { S.sheet = v; if (!String(v).startsWith('cant')) S.cant = null; renderSheet(); },
  closeSheet() { S.sheet = null; S.cant = null; renderSheet(); },
  switchRole(v) { S.role = v; S.tab = v === 'admin' ? (S.jobs.some((j) => j.status === 'waiting') && S.view && S.view.kind === 'submitted' ? 'approvals' : 'overview') : 'jobs'; S.view = null; S.sheet = null; render(false); },
  signOut() { S.user = null; S.view = null; S.sheet = null; S.login = { step: 'pick', who: null }; render(false); },
  reset() { const keep = { user: S.user, role: S.role, tab: S.role === 'admin' ? 'overview' : 'jobs' }; S = Object.assign(seed(), keep); render(false); toast('Demo reset'); },
  copy(v) { const done = () => toast('Number copied'); try { navigator.clipboard.writeText(v).then(done, () => toast(v)); } catch (e) { toast(v); } },

  // admin: overview
  openJob(v) { S.view = { kind: 'job', id: v }; render(false); },
  openApproval(v) { S.view = { kind: 'approval', id: v }; S.open = { note: '' }; render(false); },
  reassign(v) { const j = job(v); const crew = CREW[j.c]; const nxt = crew.find((n) => n !== j.installer) || j.installer; j.installer = nxt; j.status = 'scheduled'; S.view = null; render(); toast(j.store + ' moved to ' + first(nxt) + ' · notified'); },
  approveReq(v) { const j = job(v); const [d, t] = j.request.to.split(' '); j.date = d; j.time = t; j.request = null; render(); toast('Moved to ' + whenLabel(j) + ' · ' + first(j.installer) + ' notified'); },
  denyReq(v) { const j = job(v); j.request = null; render(); toast('Kept the original time · ' + first(j.installer) + ' notified'); },

  // admin: new ticket
  draftTpl(v) { const d = S.draft; d.template = +v; d.tools = TEMPLATES[+v].tools.slice(); render(); },
  draftCountry(v) { const d = S.draft; d.c = +v; d.store = 0; d.lead = 0; d.second = -1; d.price = ''; render(); },
  draftSet(v, el) { S.draft[el.dataset.k] = +v; render(); },
  draftPerson(v) { const d = S.draft, i = +v; if (d.second === -2 || d.second >= 0) { if (i === d.lead) return; d.second = d.second === i ? -2 : i; } else d.lead = i; render(); },
  draftSecond() { S.draft.second = -2; render(); },
  draftNoSecond() { S.draft.second = -1; render(); },
  draftTool(v) { const t = S.draft.tools; const i = t.indexOf(v); if (i >= 0) t.splice(i, 1); else t.push(v); render(); },
  draftNotify(v) { S.draft.notify[+v] = !S.draft.notify[+v]; render(); },
  createTicket() {
    const d = S.draft;
    const t = (d.ticket || '').trim();
    if (!t) { d.err = 'Enter the Apple ticket number from Apple’s system.'; render(false); const el = document.getElementById('ticket'); if (el) el.focus(); return; }
    d.err = '';
    const crew = CREW[d.c], st = STORES[d.c][d.store], tpl = TEMPLATES[d.template];
    const j = { id: 'n' + Date.now(), ticket: t.toUpperCase(), c: d.c, store: st[0], addr: st[1], installer: crew[d.lead], second: d.second >= 0 ? crew[d.second] : '', date: d.date || rel(0), time: d.time || '09:30', status: 'scheduled', fixture: tpl.name, tools: d.tools.slice(), parts: tpl.parts.slice(), note: d.note, last: st[0] === 'Elkjøp Storo' ? 'Ask for Kari Nilsen at the info desk. Park at the back entrance.' : '', report: null, request: null, changes: '' };
    S.jobs.unshift(j);
    const who = j.second ? first(j.installer) + ' and ' + first(j.second) : first(j.installer);
    S.draft = null; S.tab = 'overview'; S.region = d.c; S.period = 2;
    render(false);
    toast('Ticket ' + j.ticket + ' created · ' + who + (j.second ? ' were' : ' was') + ' notified');
  },

  // admin: approvals
  approve(v) { const j = job(v); j.status = 'approved'; j.request = null; if (j.report && j.report.nextNote) j.last = j.report.nextNote; S.view = null; S.tab = 'approvals'; render(false); toast(j.store + ' approved and sent to Apple'); },
  askChanges(v) { const j = job(v); j.status = 'changes'; j.changes = (S.open && S.open.note) || 'Please check the photos and resubmit.'; if (j.report) j.report.draft = true; S.view = null; render(false); toast('Sent back to ' + first(j.installer) + ' with your note'); },

  // installer
  focusJob(v) { const j = job(v); const mine = myJobs(); S.jobs = [j].concat(S.jobs.filter((x) => x !== j)); render(false); },
  startReport(v) { const j = job(v); if (j.status === 'scheduled' || j.status === 'overdue') j.status = 'progress'; ensureReport(j); S.view = { kind: 'report', id: v }; S.step = j.status === 'changes' ? 2 : 1; S.phase = 'before'; render(false); },
  closeView() { S.view = null; render(false); },
  stepNext() { const j = job(S.view.id), r = j.report; if (S.step === 1 && (r.extra || '').trim()) A.partAdd(); S.step = Math.min(3, S.step + 1); render(false); },
  stepBack() { S.step = Math.max(1, S.step - 1); render(false); },
  rset(v, el) { const r = job(S.view.id).report; r[el.dataset.k] = el.dataset.k === 'probOpen' ? !!v : v; render(); },
  partToggle(v) { const r = job(S.view.id).report; const p = r.parts[+v]; p[1] = p[1] > 0 ? 0 : 1; render(); },
  partQty(v, el) { const r = job(S.view.id).report; const p = r.parts[+v]; p[1] = Math.max(1, p[1] + Number(el.dataset.d)); render(); },
  partAdd() { const r = job(S.view.id).report; const n = (r.extra || '').trim(); if (!n) return; r.parts.push([n + ' (added on site)', 1]); r.extra = ''; render(); },
  probSave() { const r = job(S.view.id).report; r.problem = { type: r.probType, text: (r.probText || '').trim() || 'See photos.' }; r.probOpen = false; render(); toast('Problem sent · your admin gets a follow-up ticket'); },
  probRemove() { const r = job(S.view.id).report; r.problem = null; render(); },
  phase(v) { S.phase = v; render(false); },
  fillSamples() { const r = job(S.view.id).report; ['before', 'after'].forEach((k) => { r.photos[k] = r.photos[k].map((p) => (p && p.ok ? p : { sample: k, ok: true })); }); render(); toast('Sample photos added'); },
  check(v) { const r = job(S.view.id).report; r.checks[+v] = !r.checks[+v]; render(); },
  sigClear() { const r = job(S.view.id).report; r.signature = null; render(); },
  submitReport() {
    const j = job(S.view.id), r = j.report;
    if (!r.checks.every(Boolean) || !r.signature) return;
    if ((r.contact || '').trim() === '') r.contact = 'Store contact';
    r.draft = false; const now = new Date(); r.submittedAt = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    j.status = 'waiting'; j.changes = '';
    S.view = { kind: 'submitted', id: j.id }; render(false);
  },
  undoReq(v) { job(v).request = null; render(); },
  cantMode(v) { S.cant.mode = v; renderSheet(); },
  cantSlot(v) { S.cant.slot = +v; renderSheet(); },
  cantSend(v) {
    const j = job(v), m = S.cant;
    if (m.mode === 'resched') { const [d, t] = S._slots[m.slot]; j.request = { kind: 'resched', to: d + ' ' + t, reason: m.reason }; toast('Request sent to your admin'); }
    else { j.status = 'declined'; j.request = null; toast('Job declined · your admin was notified'); }
    S.sheet = null; S.cant = null; render();
  }
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a; if (!A[a]) return;
  if (el.tagName === 'A' && el.getAttribute('href')) return;
  e.preventDefault();
  A[a](el.dataset.v, el);
});
document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.dataset.bind && S.draft) { S.draft[el.dataset.bind] = el.value; if (el.dataset.bind === 'ticket' && S.draft.err) { S.draft.err = ''; el.style.outline = ''; } save(); }
  else if (el.dataset.rbind && S.view) { job(S.view.id).report[el.dataset.rbind] = el.value; save(); }
  else if (el.dataset.abind) { S.open = S.open || {}; S.open.note = el.value; }
  else if (el.dataset.cbind && S.cant) { S.cant.reason = el.value; }
});
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.dataset.rerender) render();
  if (el.dataset.shot) {
    const f = el.files && el.files[0]; if (!f) return;
    const [ph, i] = el.dataset.shot.split('-');
    const r = job(S.view.id).report;
    processPhoto(f).then((p) => {
      r.photos[ph][+i] = p; render();
      toast(p.ok ? 'Photo looks good' : p.issue.split(' ·')[0] + ': take it again');
    }).catch(() => toast('Couldn’t read that photo. Try again.'));
  }
});
window.addEventListener('pageshow', () => render());

render(false);
})();
