name: Deploy

# main  -> live app      https://<user>.github.io/<repo>/
# dev   -> test version  https://<user>.github.io/<repo>/preview/
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out live (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: live
      - name: Check out test version (dev)
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev
        continue-on-error: true
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r live/app/. _site/
          if [ -d dev/app ]; then
            mkdir -p _site/preview
            cp -r dev/app/. _site/preview/
            # mark the test version so it is never mistaken for the live app
            sed -i 's|<title>Brand Butlers App</title>|<title>Brand Butlers (test)</title>|' _site/preview/index.html
            sed -i 's|bb-iphone-demo-v3|bb-iphone-preview-v3|' _site/preview/index.html
          fi
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
