name: Deploy

# main  -> live app      https://<user>.github.io/<repo>/
# dev   -> test version  https://<user>.github.io/<repo>/preview/
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out live (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: live
      - name: Check out test version (dev)
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev
        continue-on-error: true
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r live/app/. _site/
          if [ -d dev/app ]; then
            mkdir -p _site/preview
            cp -r dev/app/. _site/preview/
            # mark the test version so it is never mistaken for the live app
            # test version: its own home screen icon and name, written straight into the page.
            # The icon gets a file name iPhone has never seen, so no old cached icon can be reused.
            V=$(git -C dev rev-parse --short HEAD)
            cp dev/app/icon-test-180.png _site/preview/bbtest-180-$V.png
            cp dev/app/icon-test-512.png _site/preview/bbtest-512-$V.png
            cp dev/app/icon-test-180.png _site/preview/icon-180.png
            cp dev/app/icon-test-512.png _site/preview/icon-512.png
            sed -i "s|href=\"icon-180.png\"|href=\"bbtest-180-$V.png\"|; s|href=\"manifest.webmanifest\"|href=\"manifest-test.webmanifest\"|; s|name=\"apple-mobile-web-app-title\" content=\"Brand Butlers\"|name=\"apple-mobile-web-app-title\" content=\"BB Test\"|; s|<title>Brand Butlers</title>|<title>BB Test</title>|; s|'icon-test-180.png'|'bbtest-180-$V.png'|" _site/preview/index.html
            sed -i "s|icon-test-512.png|bbtest-512-$V.png|; s|icon-test-180.png|bbtest-180-$V.png|" _site/preview/manifest-test.webmanifest
          fi
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
